<!DOCTYPE html>
<html>
<head>
    <title>Final Recommendation - MoodBite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="result-body">

<div class="result-card">

    <h2>Recommended Dish</h2>
    <h1>{{ dish.replace("_", " ").title() }}</h1>

    <p>🍴 Restaurant: <strong>{{ restaurant.replace("_", " ").title() }}</strong></p>
    <p>💰 Price: ₹{{ price }}</p>

    <p class="rating">⭐ 4.6 Customer Rating</p>

    <!-- AI MODE BUTTON -->
    <form action="/final" method="POST">
        <input type="hidden" name="dish" value="{{ dish }}">
        <input type="hidden" name="restaurant" value="{{ restaurant }}">
        <input type="hidden" name="price" value="{{ price }}">
        <button type="submit" style="margin-top:15px;">🤖 Ask AI Why This?</button>
    </form>

    {% if ai_response %}
    <div style="margin-top:20px; padding:15px; background:#f4f6fb; border-radius:10px; text-align:left;">
        <strong>AI Insight:</strong>
        <p>{{ ai_response }}</p>
    </div>
    {% endif %}

    <form action="/">
        <button style="margin-top:15px;">Search Again</button>
    </form>

</div>

</body>
</html>
