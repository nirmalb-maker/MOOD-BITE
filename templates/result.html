<!DOCTYPE html>
<html>
<head>
    <title>Final Recommendation - MoodBite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="result-body">

<div class="result-card">

    <h2>Recommended Dish</h2>
    <h1>{{ dish.replace("_", " ").title() }}</h1>

    <p>🍴 Restaurant: <strong>{{ restaurant.replace("_", " ").title() }}</strong></p>
    <p>💰 Price: ₹{{ price }}</p>

    <p class="rating">⭐ 4.6 Customer Rating</p>

    <form action="/">
        <button>Search Again</button>
    </form>

</div>

</body>
</html>
