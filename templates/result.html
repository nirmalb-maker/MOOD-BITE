<!DOCTYPE html>
<html>
<head>
    <title>Result - MoodBite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="result-body">

<div class="result-card">

    <h2>Recommended Dish</h2>
    <h1>{{ dish }}</h1>

    <p>Restaurant: <b>{{ restaurant }}</b></p>
    <p>Price: ₹{{ price }}</p>

    <p class="rating">⭐ 4.5 Rating</p>

    <a href="/" class="back-btn">Search Again</a>

</div>

</body>
</html>
